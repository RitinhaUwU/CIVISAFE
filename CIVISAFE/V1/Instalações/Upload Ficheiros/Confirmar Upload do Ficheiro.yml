info:
  name: Confirmar Upload do Ficheiro
  type: http
  seq: 3

http:
  method: POST
  url: "{{BASE_URL}}/api/v1/facilities/{{id}}/documents/upload"
  body:
    type: json
    data: |-
      {
        "filename": "ficheiro.pdf",
        "key": "caminho/nome-no-servidor.pdf"
      }
  auth: inherit

runtime:
  variables:
    - name: id
      value: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
