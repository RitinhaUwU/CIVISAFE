info:
  name: Editar Logística
  type: http
  seq: 3

http:
  method: PUT
  url: "{{BASE_URL}}/api/v1/incidents/{{incident_id}}/parties/{{party_id}}"
  body:
    type: json
    data: |-
      {
        "vehicle_count": 5,
        "human_count": 10,
        "entity_id": 2
      }
  auth: inherit

runtime:
  variables:
    - name: incident_id
      value: ""
    - name: party_id
      value: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
