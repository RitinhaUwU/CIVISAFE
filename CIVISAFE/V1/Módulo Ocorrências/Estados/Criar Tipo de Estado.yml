info:
  name: Criar Tipo de Estado
  type: http
  seq: 3

http:
  method: POST
  url: "{{BASE_URL}}/api/v1/incidentStates"
  body:
    type: json
    data: |-
      {
        "name": "Em Processo",
        "description": "Estado em andamento",
        "hex_color": "#D0FF00",
        "terminates_incident": "true",
        "is_active": "true"
