info:
  name: Criar Voluntário
  type: http
  seq: 3

http:
  method: POST
  url: "{{BASE_URL}}/api/v1/volunteers"
  body:
    type: json
    data: |-
      {
        "name": "João Silva",
        "contact": "912345678",
        "email": "joao@example.com",
        "classification": "single",
        "num_elements": 10,
        "mission": "Apoio logístico",
        "team_identification": "Team A",
        "start_datetime": "2026-04-20 10:00:00",
        "has_accommodation": true,
        "has_meal": false,
        "location": "Lisboa",
        "incident_id": 1
