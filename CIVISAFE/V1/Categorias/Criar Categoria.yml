info:
  name: Criar Categoria
  type: http
  seq: 3

http:
  method: POST
  url: "{{BASE_URL}}/api/v1/categories"
  body:
    type: json
    data: |-
      {
        "code": 12345,
        "name": "Nova Categoria",
        "description": "Descrição da Nova Categoria"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
