info:
  name: Autenticar Manager
  type: http
  seq: 2

http:
  method: POST
  url: "{{BASE_URL}}/api/v1/login"
  body:
    type: multipart-form
    data:
      - name: email
        type: text
        value: manager@example.com
      - name: password
        type: text
        value: password

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
