info:
  name: Autenticar Utilizador
  type: http
  seq: 1

http:
  method: POST
  url: "{{BASE_URL}}/api/v1/login"
  body:
    type: multipart-form
    data:
      - name: email
        type: text
        value: admin@example.com
      - name: password
        type: text
        value: password

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
