info:
  name: Confirmar Upload Imagem
  type: http
  seq: 8

http:
  method: POST
  url: "{{BASE_URL}}/api/v1/entities/{{id}}/upload"
  body:
    type: json
    data: |-
      {
        "key": "logotipo.png"
      }
  auth: inherit

runtime:
