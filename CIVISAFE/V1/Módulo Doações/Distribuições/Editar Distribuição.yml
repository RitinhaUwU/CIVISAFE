info:
  name: Editar Distribuição
  type: http
  seq: 7

http:
  method: PUT
  url: "{{BASE_URL}}/api/v1/donations/distributions/{{id}}"
  body:
    type: json
    data: |-
      {
        "name": "Ana Sofia",
        "contact": "910123123",
        "obs": "Observações Opcionais a adicionar à distribuição",
        "goods": [
          {
            "category_id": 1,
            "quantity": 10
          }
        ]
      }
  auth: inherit

runtime:
  variables:
    - name: id
      value: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
