http:
  method: POST
  url: "{{BASE_URL}}/api/v1/donations/distributions/"
  body:
    type: json
    data: |-
      {
        "date": "2026-07-10",
        "name": "Ana Sofia",
        "contact": "910123123",
        "email": "optional@example.com",
        "donor_type": "single",
        "goods": [
          {
