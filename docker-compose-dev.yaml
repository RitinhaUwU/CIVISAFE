services:
  database:
    # https://hub.docker.com/_/postgres
    # https://hub.docker.com/r/postgis/postgis/
    image: postgis/postgis:18-3.6-alpine
    restart: always
    shm_size: 256mb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: password
    volumes:
      - postgres:/var/lib/postgresql

  redis:
    image: redis:alpine
    restart: on-failure:3
    ports:
      - "6379:6379"


volumes:
  postgres: