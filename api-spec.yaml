openapi: 3.0.0
info:
  title: CIVISAFE API
  version: 1.0.0
servers:
- url: http://localhost:8000
- url: https://api.civisafe.pt
tags:
- name: Autenticação
  description: Operações de autenticação de utilizadores na plataforma.
- name: Entidades
  description: 'Gestão das entidades parceiras (ex: bombeiros, GNR, PSP) registadas no sistema.'
- name: Tipos de Entidade
  description: 'Gestão dos tipos de entidade disponíveis para classificação (ex: Bombeiros, Polícia).'
- name: Utilizadores
  description: Gestão de contas de utilizador da plataforma.
- name: Instalações
  description: 'Gestão das instalações (ex: juntas de freguesia, armazéns) registadas no sistema.'
- name: Doações
  description: Registo e consulta das doações de bens recebidas pela organização.
- name: Distribuições
  description: Registo e consulta das distribuições de bens efetuadas à comunidade.
- name: Tipos de Bens Doáveis
  description: Gestão dos tipos de bens que podem ser doados ou distribuídos.
- name: Stock
  description: Consulta e gestão do stock de bens doados.
- name: Ocorrências
  description: Registo e gestão das ocorrências geridas pela organização.
- name: Timeline de Ocorrência
  description: Registo cronológico (linha de tempo) de eventos e comentários associados a uma ocorrência.
- name: Logística de Ocorrência
  description: Gestão dos meios e recursos logísticos mobilizados numa ocorrência.
- name: Posto de Comando (PCO)
  description: Gestão dos postos de comando operacional (PCO) montados durante uma ocorrência.
- name: Prioridades de Ocorrência
  description: Gestão dos níveis de prioridade atribuíveis a uma ocorrência.
- name: Tipos de Ocorrência
  description: Consulta dos tipos de ocorrência disponíveis para classificação.
- name: Estados de Ocorrência
  description: 'Gestão dos estados possíveis de uma ocorrência (ex: em curso, terminada).'
- name: Voluntários
  description: Registo e gestão de voluntários/equipas mobilizados numa ocorrência.
- name: Notificações
  description: Consulta das notificações do utilizador autenticado.
paths:
  /api/v1/login:
    post:
      summary: Autenticar Utilizador
      tags:
      - Autenticação
      operationId: autenticarUtilizador
      description: Autentica um utilizador com email e password e devolve um token de acesso.
      requestBody:
        $ref: '#/components/requestBodies/autenticar_utilizador'
      responses:
        '200':
          description: Sucesso.
  /api/v1/entities:
    get:
      summary: Obter Lista de Entidades
      tags:
      - Entidades
      operationId: listarEntidades
      description: Lista todas as entidades registadas no sistema.
      responses:
        '200':
          description: Sucesso.
    post:
      summary: Criar Entidade
      tags:
      - Entidades
      operationId: criarEntidade
      description: Cria uma nova entidade no sistema.
      requestBody:
        $ref: '#/components/requestBodies/criar_entidade'
      responses:
        '200':
          description: Sucesso.
  /api/v1/entities/uploadUrl:
    post:
      summary: Pedir URL para Upload da Imagem da Entidade
      tags:
      - Entidades
      operationId: pedirUrlUploadImagemEntidade
      description: Gera um URL temporário para efetuar o upload da imagem de uma entidade.
      requestBody:
        $ref: '#/components/requestBodies/pedir_url_para_upload_da_imagem_da_entidade'
      responses:
        '200':
          description: Sucesso.
  /api/v1/entities/{id}:
    get:
      summary: Obter Entidade Especifica
      tags:
      - Entidades
      operationId: obterEntidade
      description: Obtém os dados de uma entidade específica pelo seu ID.
      responses:
        '200':
          description: Sucesso.
    put:
      summary: Editar Entidade
      tags:
      - Entidades
      operationId: editarEntidade
      description: Substitui os dados de uma entidade existente.
      requestBody:
        $ref: '#/components/requestBodies/editar_entidade'
      responses:
        '200':
          description: Sucesso.
    patch:
      summary: Atualizar Campo Especifico da Entidade
      tags:
      - Entidades
      operationId: atualizarCampoEntidade
      description: 'Atualiza um campo específico de uma entidade (ex: tipo de entidade).'
      requestBody:
        $ref: '#/components/requestBodies/atualizar_campo_especifico_da_entidade'
      responses:
        '200':
          description: Sucesso.
    delete:
      summary: Apagar Entidade
      tags:
      - Entidades
      operationId: apagarEntidade
      description: Remove uma entidade do sistema.
      responses:
        '200':
          description: Sucesso.
  /api/v1/entities/{id}/upload:
    post:
      summary: Confirmar Upload Imagem
      tags:
      - Entidades
      operationId: confirmarUploadImagemEntidade
      description: Confirma a conclusão do upload da imagem de uma entidade.
      requestBody:
        $ref: '#/components/requestBodies/confirmar_upload_imagem'
      responses:
        '200':
          description: Sucesso.
  /api/v1/entities/{id}/image:
    delete:
      summary: Remover Imagem
      tags:
      - Entidades
      operationId: removerImagemEntidade
      description: Remove a imagem associada a uma entidade.
      responses:
        '200':
          description: Sucesso.
  /api/v1/entityTypes:
    get:
      summary: Lista de Tipos de Entidade
      tags:
      - Tipos de Entidade
      operationId: listarTiposEntidade
      description: Lista todos os tipos de entidade disponíveis.
      responses:
        '200':
          description: Sucesso.
    post:
      summary: Criar Tipo de Entidade
      tags:
      - Tipos de Entidade
      operationId: criarTipoEntidade
      description: Cria um novo tipo de entidade.
      requestBody:
        $ref: '#/components/requestBodies/criar_tipo_de_entidade'
      responses:
        '200':
          description: Sucesso.
  /api/v1/entityTypes/{id}:
    get:
      summary: Tipo de Entidades Especifica
      tags:
      - Tipos de Entidade
      operationId: obterTipoEntidade
      description: Obtém os dados de um tipo de entidade específico.
      responses:
        '200':
          description: Sucesso.
    put:
      summary: Editar Tipo de Entidade
      tags:
      - Tipos de Entidade
      operationId: editarTipoEntidade
      description: Substitui os dados de um tipo de entidade existente.
      requestBody:
        $ref: '#/components/requestBodies/editar_tipo_de_entidade'
      responses:
        '200':
          description: Sucesso.
    patch:
      summary: Atualizar Campo Especifico do Tipo de Entidade
      tags:
      - Tipos de Entidade
      operationId: atualizarCampoTipoEntidade
      description: 'Atualiza um campo específico de um tipo de entidade (ex: descrição).'
      requestBody:
        $ref: '#/components/requestBodies/atualizar_campo_especifico_do_tipo_de_entidade'
      responses:
        '200':
          description: Sucesso.
    delete:
      summary: Apagar Tipo de Entidade
      tags:
      - Tipos de Entidade
      operationId: apagarTipoEntidade
      description: Remove um tipo de entidade do sistema.
      responses:
        '200':
          description: Sucesso.
  /api/v1/users:
    get:
      summary: Lista de Utilizadores
      tags:
      - Utilizadores
      operationId: listarUtilizadores
      description: Lista todos os utilizadores registados.
      responses:
        '200':
          description: Sucesso.
    post:
      summary: Criar Utilizador
      tags:
      - Utilizadores
      operationId: criarUtilizador
      description: Cria um novo utilizador no sistema.
      requestBody:
        $ref: '#/components/requestBodies/criar_utilizador'
      responses:
        '200':
          description: Sucesso.
  /api/v1/users/{id}:
    get:
      summary: Dados Utilizador
      tags:
      - Utilizadores
      operationId: obterUtilizador
      description: Obtém os dados de um utilizador específico pelo seu ID.
      responses:
        '200':
          description: Sucesso.
    put:
      summary: Editar Utilizador
      tags:
      - Utilizadores
      operationId: editarUtilizador
      description: Substitui os dados de um utilizador existente.
      requestBody:
        $ref: '#/components/requestBodies/editar_utilizador'
      responses:
        '200':
          description: Sucesso.
    patch:
      summary: Atualizar Utilizador
      tags:
      - Utilizadores
      operationId: atualizarCampoUtilizador
      description: 'Atualiza um campo específico de um utilizador (ex: bloqueio de conta).'
      requestBody:
        $ref: '#/components/requestBodies/atualizar_utilizador'
      responses:
        '200':
          description: Sucesso.
    delete:
      summary: Apagar Utilizador
      tags:
      - Utilizadores
      operationId: apagarUtilizador
      description: Remove um utilizador do sistema.
      responses:
        '200':
          description: Sucesso.
  /api/v1/user:
    get:
      summary: Dados Utilizador Auth
      tags:
      - Utilizadores
      operationId: obterUtilizadorAutenticado
      description: Obtém os dados do utilizador atualmente autenticado.
      responses:
        '200':
          description: Sucesso.
  /api/v1/facilities:
    get:
      summary: Lista de Instalações
      tags:
      - Instalações
      operationId: listarInstalacoes
      description: Lista todas as instalações registadas.
      responses:
        '200':
          description: Sucesso.
    post:
      summary: Criar Instalação
      tags:
      - Instalações
      operationId: criarInstalacao
      description: Cria uma nova instalação no sistema.
      requestBody:
        $ref: '#/components/requestBodies/criar_instala_o'
      responses:
        '200':
          description: Sucesso.
  /api/v1/facilities/uploadUrl:
    post:
      summary: Pedir URL para Upload da Imagem
      tags:
      - Instalações
      operationId: pedirUrlUploadImagemInstalacao
      description: Gera um URL temporário para efetuar o upload da imagem de uma instalação.
      requestBody:
        $ref: '#/components/requestBodies/pedir_url_para_upload_da_imagem'
      responses:
        '200':
          description: Sucesso.
  /api/v1/facilities/{id}:
    get:
      summary: Instalação Específica
      tags:
      - Instalações
      operationId: obterInstalacao
      description: Obtém os dados de uma instalação específica.
      responses:
        '200':
          description: Sucesso.
    put:
      summary: Editar Instalação
      tags:
      - Instalações
      operationId: editarInstalacao
      description: Substitui os dados de uma instalação existente.
      requestBody:
        $ref: '#/components/requestBodies/editar_instala_o'
      responses:
        '200':
          description: Sucesso.
    patch:
      summary: Atualizar Campo Instalação
      tags:
      - Instalações
      operationId: atualizarCampoInstalacao
      description: 'Atualiza um campo específico de uma instalação (ex: imagem).'
      requestBody:
        $ref: '#/components/requestBodies/atualizar_campo_instala_o'
      responses:
        '200':
          description: Sucesso.
    delete:
      summary: Apagar Instalação
      tags:
      - Instalações
      operationId: apagarInstalacao
      description: Remove uma instalação do sistema.
      responses:
        '200':
          description: Sucesso.
  /api/v1/facilities/{id}/upload:
    post:
      summary: Confirmar Upload Imagem
      tags:
      - Instalações
      operationId: confirmarUploadImagemInstalacao
      description: Confirma a conclusão do upload da imagem de uma instalação.
      requestBody:
        $ref: '#/components/requestBodies/confirmar_upload_imagem_1'
      responses:
        '200':
          description: Sucesso.
  /api/v1/facilities/{id}/image:
    delete:
      summary: Remover Imagem
      tags:
      - Instalações
      operationId: removerImagemInstalacao
      description: Remove a imagem associada a uma instalação.
      responses:
        '200':
          description: Sucesso.
  /api/v1/facilities/documents/uploadURL:
    post:
      summary: Pedir URL para Upload do Ficheiro
      tags:
      - Instalações
      operationId: pedirUrlUploadFicheiroInstalacao
      description: Gera um URL temporário para efetuar o upload de um documento de uma instalação.
      requestBody:
        $ref: '#/components/requestBodies/pedir_url_para_upload_do_ficheiro'
      responses:
        '200':
          description: Sucesso.
  /api/v1/facilities/{id}/documents/upload:
    post:
      summary: Confirmar Upload do Ficheiro
      tags:
      - Instalações
      operationId: confirmarUploadFicheiroInstalacao
      description: Confirma a conclusão do upload de um documento de uma instalação.
      requestBody:
        $ref: '#/components/requestBodies/confirmar_upload_do_ficheiro'
      responses:
        '200':
          description: Sucesso.
  /api/v1/facilities/{facility_id}/documentos/{file_id}/download:
    get:
      summary: Obter Link para Download do Ficheiro
      tags:
        - Instalações
      operationId: obterLinkDownloadFicheiroInstalacao
      description: Obter o link para o download do ficheiro.
      responses:
        '200':
          description: Sucesso.
  /api/v1/facilities/{facility_id}/documentos/{file_id}:
    delete:
      summary: Remover Ficheiro
      tags:
      - Instalações
      operationId: removerFicheiroInstalacao
      description: Remove um documento associado a uma instalação.
      responses:
        '200':
          description: Sucesso.
  /api/v1/donations/:
    get:
      summary: Lista de Doações
      tags:
      - Doações
      operationId: listarDoacoes
      description: Lista todas as doações recebidas.
      responses:
        '200':
          description: Sucesso.
    post:
      summary: Criar Doação
      tags:
      - Doações
      operationId: criarDoacao
      description: Regista uma nova doação recebida.
      requestBody:
        $ref: '#/components/requestBodies/criar_doacao'
      responses:
        '200':
          description: Sucesso.
  /api/v1/donations/stats:
    get:
      summary: Estatisticas
      tags:
      - Doações
      operationId: obterEstatisticasDoacoes
      description: Obtém estatísticas gerais sobre as doações recebidas.
      responses:
        '200':
          description: Sucesso.
  /api/v1/donations/{id}:
    get:
      summary: Dados de uma Doação
      tags:
      - Doações
      operationId: obterDoacao
      description: Obtém os dados de uma doação específica.
      responses:
        '200':
          description: Sucesso.
    put:
      summary: Editar Doação
      tags:
      - Doações
      operationId: editarDoacao
      description: Substitui os dados de uma doação existente.
      requestBody:
        $ref: '#/components/requestBodies/editar_doa_o'
      responses:
        '200':
          description: Sucesso.
  /api/v1/donations/{id}/audit:
    get:
      summary: Audit/Histórico de uma Doação
      tags:
      - Doações
      operationId: obterAuditoriaDoacao
      description: Obtém o histórico de alterações de uma doação específica.
      responses:
        '200':
          description: Sucesso.
  /api/v1/donations/distributions/:
    get:
      summary: Lista de Distribuições
      tags:
      - Distribuições
      operationId: listarDistribuicoes
      description: Lista todas as distribuições de bens efetuadas.
      responses:
        '200':
          description: Sucesso.
    post:
      summary: Criar Distribuição
      tags:
      - Distribuições
      operationId: criarDistribuicao
      description: Regista uma nova distribuição de bens à comunidade.
      requestBody:
        $ref: '#/components/requestBodies/criar_distribui_o'
      responses:
        '200':
          description: Sucesso.
  /api/v1/donations/distributions/rules:
    get:
      summary: Obter Regras
      tags:
      - Distribuições
      operationId: obterRegrasDistribuicao
      description: Obtém as regras atuais de distribuição de bens, em formato Markdown.
      responses:
        '200':
          description: Sucesso.
    post:
      summary: Editar Regras
      tags:
      - Distribuições
      operationId: editarRegrasDistribuicao
      description: Atualiza o corpo de texto das regras de distribuição.
      requestBody:
        $ref: '#/components/requestBodies/editar_regras'
      responses:
        '200':
          description: Sucesso.
  /api/v1/donations/distributions/{id}:
    get:
      summary: Dados de uma Distribuição
      tags:
      - Distribuições
      operationId: obterDistribuicao
      description: Obtém os dados de uma distribuição específica.
      responses:
        '200':
          description: Sucesso.
    put:
      summary: Editar Distribuição
      tags:
      - Distribuições
      operationId: editarDistribuicao
      description: Substitui os dados de uma distribuição existente.
      requestBody:
        $ref: '#/components/requestBodies/editar_distribui_o'
      responses:
        '200':
          description: Sucesso.
  /api/v1/donations/distributions/{id}/audit:
    get:
      summary: Auditoria a uma Distribuição
      tags:
      - Distribuições
      operationId: obterAuditoriaDistribuicao
      description: Obtém o histórico de alterações de uma distribuição específica.
      responses:
        '200':
          description: Sucesso.
  /api/v1/donationGoodsTypes:
    get:
      summary: Lista Tipos de Bens
      tags:
      - Tipos de Bens Doáveis
      operationId: listarTiposBens
      description: Lista todos os tipos de bens doáveis disponíveis.
      responses:
        '200':
          description: Sucesso.
    post:
      summary: Criar Tipo de Bem
      tags:
      - Tipos de Bens Doáveis
      operationId: criarTipoBem
      description: Cria um novo tipo de bem doável.
      requestBody:
        $ref: '#/components/requestBodies/criar_tipo_de_bem'
      responses:
        '200':
          description: Sucesso.
  /api/v1/donationGoodsTypes/{id}:
    get:
      summary: Tipo de Bens
      tags:
      - Tipos de Bens Doáveis
      operationId: obterTipoBem
      description: Obtém os dados de um tipo de bem específico.
      responses:
        '200':
          description: Sucesso.
    put:
      summary: Editar Tipo de Bem
      tags:
      - Tipos de Bens Doáveis
      operationId: editarTipoBem
      description: Substitui os dados de um tipo de bem existente.
      requestBody:
        $ref: '#/components/requestBodies/editar_tipo_de_bem'
      responses:
        '200':
          description: Sucesso.
    delete:
      summary: Apagar Tipo de Bem
      tags:
      - Tipos de Bens Doáveis
      operationId: apagarTipoBem
      description: Remove um tipo de bem doável do sistema.
      responses:
        '200':
          description: Sucesso.
  /api/v1/donations/stock:
    get:
      summary: Stock de Bens
      tags:
      - Stock
      operationId: obterStock
      description: Obtém o stock atual de bens doados.
      responses:
        '200':
          description: Sucesso.
  /api/v1/donations/stock/audit:
    get:
      summary: Obter Registo de Auditoria
      tags:
      - Stock
      operationId: obterAuditoriaStock
      description: Obtém o registo de auditoria de alterações ao stock.
      responses:
        '200':
          description: Sucesso.
    post:
      summary: Registar Alteração Manual ao Stock
      tags:
      - Stock
      operationId: registarAlteracaoStock
      description: Regista uma alteração manual (entrada ou remoção) ao stock de bens.
      requestBody:
        $ref: '#/components/requestBodies/registar_altera_o_manual_ao_stock'
      responses:
        '200':
          description: Sucesso.
  /api/v1/donations/stock/unlock:
    get:
      summary: Obter Estado do Bloqueio de Stock
      tags:
      - Stock
      operationId: obterEstadoBloqueioStock
      description: Obtém o estado atual do bloqueio de stock.
      responses:
        '200':
          description: Sucesso.
    post:
      summary: Alterar Estado do Bloqueio de Stock
      tags:
      - Stock
      operationId: alterarEstadoBloqueioStock
      description: Altera o estado de bloqueio do stock (bloqueado/desbloqueado).
      requestBody:
        $ref: '#/components/requestBodies/alterar_estado_do_bloqueio_de_stock'
      responses:
        '200':
          description: Sucesso.
  /api/v1/incidents:
    get:
      summary: Lista Ocorrências
      tags:
      - Ocorrências
      operationId: listarOcorrencias
      description: Lista todas as ocorrências registadas.
      responses:
        '200':
          description: Sucesso.
    post:
      summary: Criar Ocorrências
      tags:
      - Ocorrências
      operationId: criarOcorrencia
      description: Cria uma nova ocorrência no sistema.
      requestBody:
        $ref: '#/components/requestBodies/criar_ocorr_ncias'
      responses:
        '200':
          description: Sucesso.
  /api/v1/incidents/{id}:
    get:
      summary: Ocorrência Especifica
      tags:
      - Ocorrências
      operationId: obterOcorrencia
      description: Obtém os dados de uma ocorrência específica.
      responses:
        '200':
          description: Sucesso.
    put:
      summary: Editar Ocorrência
      tags:
      - Ocorrências
      operationId: editarOcorrencia
      description: Substitui os dados de uma ocorrência existente.
      requestBody:
        $ref: '#/components/requestBodies/editar_ocorr_ncia'
      responses:
        '200':
          description: Sucesso.
    patch:
      summary: Atualizar Campo Específico
      tags:
      - Ocorrências
      operationId: atualizarCampoOcorrencia
      description: 'Atualiza um campo específico de uma ocorrência (ex: nome da fonte do alerta).'
      requestBody:
        $ref: '#/components/requestBodies/atualizar_campo_espec_fico'
      responses:
        '200':
          description: Sucesso.
    delete:
      summary: Apagar Ocorrência
      tags:
      - Ocorrências
      operationId: apagarOcorrencia
      description: Remove uma ocorrência do sistema.
      responses:
        '200':
          description: Sucesso.
  /api/v1/incidents/{id}/timeline:
    get:
      summary: Logs Específicos de uma Ocorrência
      tags:
      - Timeline de Ocorrência
      operationId: listarLogsOcorrencia
      description: Lista os logs/linha de tempo de uma ocorrência específica.
      responses:
        '200':
          description: Sucesso.
  /api/v1/incidents/{incident_id}/comments:
    post:
      summary: Criar Logs de uma Ocorrência
      tags:
      - Timeline de Ocorrência
      operationId: criarLogOcorrencia
      description: Cria um novo log/comentário na linha de tempo de uma ocorrência.
      requestBody:
        $ref: '#/components/requestBodies/criar_logs_de_uma_ocorr_ncia_copy'
      responses:
        '200':
          description: Sucesso.
  /api/v1/incidents/{incident_id}/comments/{comment_id}:
    put:
      summary: Editar Logs de uma Ocorrência
      tags:
      - Timeline de Ocorrência
      operationId: editarLogOcorrencia
      description: Substitui o conteúdo de um log específico da linha de tempo de uma ocorrência.
      requestBody:
        $ref: '#/components/requestBodies/editar_logs_de_uma_ocorr_ncia'
      responses:
        '200':
          description: Sucesso.
  /api/v1/incidents/{incident_id}/parties:
    get:
      summary: Lista de Logísticas
      tags:
      - Logística de Ocorrência
      operationId: listarLogisticaOcorrencia
      description: Lista os meios e recursos logísticos associados a uma ocorrência.
      responses:
        '200':
          description: Sucesso.
    post:
      summary: Criar Logística
      tags:
      - Logística de Ocorrência
      operationId: criarLogisticaOcorrencia
